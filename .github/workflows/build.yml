name: 앱 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 프로젝트 풀기
        run: unzip -q potion-app.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 패키지 설치
        working-directory: potion-app
        run: npm ci
      - name: 게임 화면을 앱에 넣기
        working-directory: potion-app
        run: npx cap sync android
      - name: 시험용 앱(APK) 만들기
        working-directory: potion-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: 결과 올리기
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-test-apk
          path: potion-app/android/app/build/outputs/apk/debug/app-debug.apk
